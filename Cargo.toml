[package]
name = "shrieker"
version = "0.5.1"
edition = "2024"
description = "A GUI client for the sculk P2P tunnel library"
license = "GPL-3.0"

[package.metadata.bundle]
name = "shrieker"
identifier = "io.github.kercyding.shrieker"
short_description = "A GUI client for the sculk P2P tunnel library"
copyright = "Copyright © 2026 KercyDing"
category = "public.app-category.utilities"
icon = ["assets/icon.icns", "assets/icon.ico"]

[package.metadata.deb]
copyright = "Copyright © 2026 KercyDing"
depends = "$auto, libayatana-appindicator3-1 | libappindicator3-1"
assets = [
    ["target/release/shrieker", "usr/bin/", "755"],
    ["assets/icon.png", "usr/share/pixmaps/shrieker.png", "644"],
    ["./shrieker.desktop", "usr/share/applications/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/shrieker", dest = "/usr/bin/shrieker", mode = "755" },
    { source = "assets/icon.png", dest = "/usr/share/pixmaps/shrieker.png", mode = "644" },
    { source = "./shrieker.desktop", dest = "/usr/share/applications/shrieker.desktop", mode = "644" },
]

[package.metadata.generate-rpm.requires]
libayatana-appindicator-gtk3 = "*"

[dependencies]
sculk = { git = "https://github.com/KercyDing/sculk.git", features = ["persist"] }
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rust-i18n = "4"
dirs = "6"
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
