name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: shrieker

jobs:
  build:
    name: Build and package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            suffix: linux-amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            suffix: linux-arm64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            suffix: darwin-amd64
          - target: aarch64-apple-darwin
            runner: macos-15
            suffix: darwin-arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            suffix: windows-amd64
            arch: x64
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            suffix: windows-arm64
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve package version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ -z "${version}" ]]; then
            echo "release version is empty" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            rpm \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install packagers (Linux)
        if: runner.os == 'Linux'
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Install packager (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "${RUNNER_TEMP}/dmgbuild"
          "${RUNNER_TEMP}/dmgbuild/bin/pip" install "dmgbuild==1.6.7"
          echo "${RUNNER_TEMP}/dmgbuild/bin" >> "${GITHUB_PATH}"
          cargo install --locked cargo-bundle

      - name: Install packager (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }}
          cargo deb --target ${{ matrix.target }} --no-build
          cargo generate-rpm --target ${{ matrix.target }}

          deb_path="$(find target -type f -name '*.deb' | head -n 1)"
          rpm_path="$(find target -type f -name '*.rpm' | head -n 1)"

          cp "$deb_path" \
            "${BIN_NAME}-${{ steps.package.outputs.version }}-${{ matrix.suffix }}.deb"
          cp "$rpm_path" \
            "${BIN_NAME}-${{ steps.package.outputs.version }}-${{ matrix.suffix }}.rpm"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo bundle --release --target ${{ matrix.target }}

          app_path="$(find target -type d -name "${BIN_NAME}.app" | head -n 1)"
          ./packaging/macos/package.sh \
            "$app_path" \
            "${BIN_NAME}-${{ steps.package.outputs.version }}-${{ matrix.suffix }}.dmg"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --target ${{ matrix.target }}
          New-Item -ItemType Directory -Force -Path target/release | Out-Null
          Copy-Item `
            "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" `
            "target/release/$env:BIN_NAME.exe" `
            -Force
          & ".\packaging\windows\package.ps1" `
            -Version "${{ steps.package.outputs.version }}" `
            -Arch "${{ matrix.arch }}"

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-packages
          path: |
            ${{ env.BIN_NAME }}-${{ steps.package.outputs.version }}-${{ matrix.suffix }}.deb
            ${{ env.BIN_NAME }}-${{ steps.package.outputs.version }}-${{ matrix.suffix }}.rpm
          if-no-files-found: error

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-packages
          path: ${{ env.BIN_NAME }}-${{ steps.package.outputs.version }}-${{ matrix.suffix }}.dmg
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-packages
          path: dist/installers/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve package version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ -z "${version}" ]]; then
            echo "release version is empty" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: shrieker-*
          body: |
            ## 安装

            | 系统 | 架构 | 下载 |
            | --- | --- | --- |
            | Windows | x86_64 | [安装程序（.exe）](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/shrieker-${{ steps.package.outputs.version }}-windows-amd64-setup.exe) |
            | Windows | ARM64 | [安装程序（.exe）](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/shrieker-${{ steps.package.outputs.version }}-windows-arm64-setup.exe) |
            | macOS | Intel | [磁盘映像（.dmg）](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/shrieker-${{ steps.package.outputs.version }}-darwin-amd64.dmg) |
            | macOS | Apple Silicon | [磁盘映像（.dmg）](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/shrieker-${{ steps.package.outputs.version }}-darwin-arm64.dmg) |
            | Linux | x86_64 | [软件包（.deb）](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/shrieker-${{ steps.package.outputs.version }}-linux-amd64.deb) / [软件包（.rpm）](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/shrieker-${{ steps.package.outputs.version }}-linux-amd64.rpm) |
            | Linux | ARM64 | [软件包（.deb）](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/shrieker-${{ steps.package.outputs.version }}-linux-arm64.deb) / [软件包（.rpm）](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/shrieker-${{ steps.package.outputs.version }}-linux-arm64.rpm) |

            ### Windows

            下载对应架构的安装程序，运行后按照安装向导完成安装。

            大多数 Windows 电脑使用 `x86_64`；搭载 ARM 处理器的设备使用 ARM64 版本。

            ### macOS

            打开 `.dmg` 文件后，将 `shrieker.app` 拖入 `Applications` 文件夹。

            当前发布的应用未进行 Apple 签名和公证，macOS 可能提示应用已损坏。此时可在终端执行：

            ```sh
            xattr -dr com.apple.quarantine /Applications/shrieker.app
            ```

            若仍被拦截，可前往“系统设置 → 隐私与安全性”选择“仍要打开”，或右键应用后选择“打开”。

            > 买不起 Apple 开发者账号 🥹

            ---

          generate_release_notes: true

  publish-aur:
    needs: release
    uses: ./.github/workflows/aur.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
